<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="pagehead(title)">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${title}">Vault Demo App</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/style.css}" rel="stylesheet">
    </th:block>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Vault Demo (Spring Boot)</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/secrets}">Secrets</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/vault-info}">Vault Info</a></li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="text-center text-muted small my-4">
    DevOps learning project (Spring Boot + Spring Vault) &mdash; secrets shown here always come live from HashiCorp Vault, never from source code.
</footer>
</body>
</html>
